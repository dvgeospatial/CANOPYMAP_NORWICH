<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Norwich 3D Terrain & Watershed Crowns</title>

  <!-- Mapbox GL JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    .app-container {
      display: grid;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      grid-template-columns: 1fr 320px;
      grid-template-rows: 60px 1fr;
      grid-template-areas: "header header" "map sidebar";
    }
    
    .header-bar {
      grid-area: header;
      background-color: #19606b;
      display: grid;
      grid-template-columns: minmax(160px, auto) 1fr minmax(160px, auto);
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      z-index: 1000;
    }
    
    .header-zone { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .header-zone-left { justify-content: flex-start; }
    .header-zone-center { justify-content: center; text-align: center; min-width: 0; }
    .header-zone-right { justify-content: flex-end; }
    
    #app-header-title {
      color: #ffffff;
      font-size: 24px;
      font-weight: bold;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .map-window {
      grid-area: map;
      position: relative;
      background-color: #e5e5e5;
    }
    
    /* Ensure the Mapbox canvas fills the container */
    #map { width: 100%; height: 100%; }

    .sidebar {
      grid-area: sidebar;
      background-color: #f2f2f2;
      border-left: 1px solid #d9d9d9;
      /* Set up flex so footer docks at bottom while content scrolls */
      display: flex;
      flex-direction: column;
      z-index: 500;
      overflow: hidden;
    }

    .sidebar-content {
      padding: 16px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Controls styling adapted for the sidebar */
    .layer-group { margin-bottom: 20px; }
    .layer-group-title { font-size: 18px; font-weight: 700; color: #2f2f2f; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid #d9d9d9; }
    .layer-group-items { display: flex; flex-direction: column; gap: 12px; }
    
    .layer-row { display: flex; align-items: center; font-size: 14px; cursor: pointer; color: #333; }
    .layer-row input[type="checkbox"] { margin-right: 10px; cursor: pointer; accent-color: #333; }

    .slider-container { display: flex; flex-direction: column; gap: 6px; }
    .slider-container label { font-size: 13px; font-weight: 600; color: #4a4a4a; }
    input[type=range] { width: 100%; cursor: pointer; accent-color: #111; }

    /* EXACT Wisefrog Footer Extracted from Target Code */
    #wisefrog-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.5rem;
      padding: 1rem 1.5rem max(1.25rem, env(safe-area-inset-bottom));
      border-top: 1px solid rgba(64, 99, 129, 0.12);
      flex-shrink: 0;
      background: inherit;
      z-index: 10;
    }
    #wisefrog-footer span {
      font-size: 0.65rem;
      font-weight: 600;
      color: #406381;
      opacity: 0.5;
      letter-spacing: 0.02em;
      white-space: nowrap;
      line-height: 1;
    }
    #wisefrog-footer img {
      height: 28px;
      width: auto;
      display: block;
      opacity: 0.6;
      transition: opacity 0.15s ease;
    }
    #wisefrog-footer:hover span { opacity: 0.85; }
    #wisefrog-footer:hover img { opacity: 1; }

  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header Area -->
    <header class="header-bar" id="app-header-bar">
      <div class="header-zone header-zone-left"></div>
      <div class="header-zone header-zone-center">
        <h2 id="app-header-title">canopyMap by Wisefrog; Norwich tree cover</h2>
      </div>
      <div class="header-zone header-zone-right"></div>
    </header>

    <!-- Map Area -->
    <div class="map-window">
      <div id="map"></div>
    </div>

    <!-- Sidebar Area -->
    <aside class="sidebar" id="app-sidebar">
      
      <!-- Scrollable Sidebar Content -->
      <div class="sidebar-content">
        <div class="layer-group">
          <h3 class="layer-group-title">Map Layers</h3>
          <div class="layer-group-items">
            
            <div class="layer-row">
              <input type="checkbox" id="chkCrowns" checked onchange="toggleLayer('crowns-extrusion', this.checked); toggleLayer('crowns-outline', this.checked)">
              <label for="chkCrowns">canopyMap</label>
            </div>
            
            <div class="layer-row">
              <input type="checkbox" id="chkBuildings" checked onchange="toggleLayer('3d-buildings', this.checked)">
              <label for="chkBuildings">3D Buildings</label>
            </div>
            
            <div class="layer-row">
              <input type="checkbox" id="chkSatellite" onchange="toggleLayer('satellite-layer', this.checked)">
              <label for="chkSatellite">Satellite</label>
            </div>

          </div>
        </div>

        <div class="layer-group">
          <h3 class="layer-group-title">Terrain Settings</h3>
          <div class="layer-group-items">
            <div class="slider-container">
              <label for="exaggeration">Terrain Exaggeration: <span id="exagValue">2.0</span>x</label>
              <input id="exaggeration" type="range" min="0" max="10" step="0.1" value="2" />
            </div>
          </div>
        </div>
      </div>

      <!-- Wisefrog Footer (Docked at bottom) -->
      <div id="wisefrog-footer">
          <span>smart mapping by wisefrog</span>
          <a href="https://www.wisefrog.co.uk" target="_blank" rel="noopener noreferrer" aria-label="Wise Frog Limited">
              <img src="https://tourmaline-pudding-0fce6c.netlify.app/assets/logos/frog_best.svg" alt="WiseFrog logo">
          </a>
      </div>

    </aside>
  </div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1Ijoid2lzZWZyb2dtYXBib3giLCJhIjoiY21zZWp6MHQwMDEwcDJ3c2Zuemt3b3JxaCJ9.cQdNn0RvFCAAGriAH9bGTQ';

    const INITIAL_CENTER = [1.2974, 52.6293]; // Norwich coords
    const INITIAL_ZOOM = 15;

    const map = new mapboxgl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          osm: {
            type: 'raster',
            tiles: [
              'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
              'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
              'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
            ],
            tileSize: 256,
            attribution: '&copy; OpenStreetMap contributors'
          }
        },
        layers: [
          {
            id: 'osm-base',
            type: 'raster',
            source: 'osm'
          }
        ]
      },
      center: INITIAL_CENTER,
      zoom: INITIAL_ZOOM,
      pitch: 60,
      bearing: 0,
      projection: 'globe'
    });

    map.addControl(new mapboxgl.NavigationControl({ visualizePitch: true }), 'top-right');
    map.addControl(new mapboxgl.ScaleControl(), 'bottom-left');

    map.on('load', () => {
      try {
        map.addSource('mapbox-dem', {
          type: 'raster-dem',
          url: 'mapbox://mapbox.mapbox-terrain-dem-v1',
          tileSize: 512,
          maxzoom: 14
        });
        map.setTerrain({ source: 'mapbox-dem', exaggeration: 2.0 });

        map.addLayer({
          id: 'sky',
          type: 'sky',
          paint: {
            'sky-type': 'atmosphere',
            'sky-atmosphere-sun': [0.0, 0.0],
            'sky-atmosphere-sun-intensity': 15
          }
        });

        map.addSource('satellite-source', {
          type: 'raster',
          url: 'mapbox://mapbox.satellite',
          tileSize: 256
        });

        map.addLayer({
          id: 'satellite-layer',
          type: 'raster',
          source: 'satellite-source',
          layout: { visibility: 'none' }
        });

        map.addSource('mapbox-streets', {
          type: 'vector',
          url: 'mapbox://mapbox.mapbox-streets-v8'
        });

        map.addLayer({
          'id': '3d-buildings',
          'source': 'mapbox-streets',
          'source-layer': 'building',
          'filter': ['==', 'extrude', 'true'],
          'type': 'fill-extrusion',
          'minzoom': 14,
          'layout': { visibility: 'visible' },
          'paint': {
            'fill-extrusion-color': '#e5e5e5',
            'fill-extrusion-height': [
              'interpolate',
              ['linear'],
              ['zoom'],
              14, 0,
              14.05, ['get', 'height']
            ],
            'fill-extrusion-base': [
              'interpolate',
              ['linear'],
              ['zoom'],
              14, 0,
              14.05, ['get', 'min_height']
            ],
            'fill-extrusion-opacity': 0.7
          }
        });

        map.addSource('crowns-data', {
          type: 'vector',
          url: 'mapbox://wisefrogmapbox.norwich_ws_crowns_3d_v1'
        });

        map.addLayer({
          id: 'crowns-extrusion',
          type: 'fill-extrusion',
          source: 'crowns-data',
          'source-layer': 'norwich_ws_crowns',
          layout: { visibility: 'visible' },
          paint: {
            'fill-extrusion-color': '#2e8b57',
            'fill-extrusion-opacity': 0.85,
            'fill-extrusion-height': [
              '*',
              [
                'coalesce',
                ['to-number', ['get', 'max_height']],
                5
              ],
              0.5 
            ],
            'fill-extrusion-base': 0
          }
        });

        map.addLayer({
          id: 'crowns-outline',
          type: 'line',
          source: 'crowns-data',
          'source-layer': 'norwich_ws_crowns',
          layout: { visibility: 'visible' },
          paint: {
            'line-color': '#0b3d1f',
            'line-width': 1
          }
        });

        map.on('click', 'crowns-extrusion', (e) => {
          const props = e.features?.[0]?.properties || {};
          new mapboxgl.Popup()
            .setLngLat(e.lngLat)
            .setHTML(`<strong>Norwich Watershed Crowns</strong><br>Max Height: ${props.max_height ?? 'N/A'} m`)
            .addTo(map);
        });

        map.on('mouseenter', 'crowns-extrusion', () => { map.getCanvas().style.cursor = 'pointer'; });
        map.on('mouseleave', 'crowns-extrusion', () => { map.getCanvas().style.cursor = ''; });

      } catch (err) {
        console.error("Map load error:", err);
      }
    });

    function toggleLayer(layerId, visible) {
      if (map.getLayer(layerId)) {
        map.setLayoutProperty(layerId, 'visibility', visible ? 'visible' : 'none');
      }
    }

    document.getElementById('exaggeration').addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById('exagValue').innerText = val.toFixed(1);
      map.setTerrain({ source: 'mapbox-dem', exaggeration: val });
    });
  </script>
</body>
</html>

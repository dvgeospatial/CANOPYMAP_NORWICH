<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Accessible, responsive viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Norwich 3D Terrain & Watershed Crowns</title>

  <!-- Mapbox GL JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .app-container {
      display: grid;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      grid-template-columns: 1fr 320px;
      grid-template-rows: 60px 1fr;
      grid-template-areas:
        "header header"
        "map sidebar";
    }

    /* Sidebar closed (desktop baseline) */
    .app-container.sidebar-closed {
      grid-template-columns: 1fr 0;
    }

    .app-container.sidebar-closed .sidebar {
      display: none;
    }

    .header-bar {
      grid-area: header;
      background-color: #19606b;
      display: grid;
      grid-template-columns: minmax(160px, auto) 1fr minmax(160px, auto);
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      z-index: 1000;
    }

    .header-zone {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .header-zone-left { justify-content: flex-start; }
    .header-zone-center { justify-content: center; text-align: center; min-width: 0; }
    .header-zone-right { justify-content: flex-end; }

    #app-header-title {
      color: #ffffff;
      font-size: 24px;
      font-weight: bold;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .map-window {
      grid-area: map;
      position: relative;
      background-color: #e5e5e5;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .sidebar {
      grid-area: sidebar;
      background-color: #f2f2f2;
      border-left: 1px solid #d9d9d9;
      display: flex;
      flex-direction: column;
      z-index: 500;
      overflow: hidden;
    }

    .sidebar-content {
      padding: 16px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .layer-group { margin-bottom: 20px; }
    .layer-group-title {
      font-size: 18px;
      font-weight: 700;
      color: #2f2f2f;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #d9d9d9;
    }
    .layer-group-items {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .layer-row {
      display: flex;
      align-items: center;
      font-size: 14px;
      cursor: pointer;
      color: #333;
    }
    .layer-row input[type="checkbox"] {
      margin-right: 10px;
      cursor: pointer;
      accent-color: #333;
    }

    .slider-container { display: flex; flex-direction: column; gap: 6px; }
    .slider-container label {
      font-size: 13px;
      font-weight: 600;
      color: #4a4a4a;
    }
    input[type=range] {
      width: 100%;
      cursor: pointer;
      accent-color: #111;
    }

    /* Wisefrog Footer */
    #wisefrog-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.5rem;
      padding: 1rem 1.5rem max(1.25rem, env(safe-area-inset-bottom));
      border-top: 1px solid rgba(64, 99, 129, 0.12);
      flex-shrink: 0;
      background: inherit;
      z-index: 10;
    }
    #wisefrog-footer span {
      font-size: 0.65rem;
      font-weight: 600;
      color: #406381;
      opacity: 0.5;
      letter-spacing: 0.02em;
      white-space: nowrap;
      line-height: 1;
    }
    #wisefrog-footer img {
      height: 28px;
      width: auto;
      display: block;
      opacity: 0.6;
      transition: opacity 0.15s ease;
    }
    #wisefrog-footer:hover span { opacity: 0.85; }
    #wisefrog-footer:hover img { opacity: 1; }

    /* Pop-out button styling */
    .expand-map-button {
      padding: 6px 12px;
      border-radius: 9999px;
      border: none;
      background-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
      white-space: nowrap;
    }
    .expand-map-button:hover {
      background-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    /* Custom layers control styled like Leaflet's layers icon */
    .mapboxgl-ctrl.layers-toggle-ctrl {
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .layers-toggle-button {
      width: 30px;
      height: 30px;
      background-color: #fff;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      background-position: center;
      background-repeat: no-repeat;
      background-size: 26px 26px;
      /* Use the standard Leaflet layers icon */
      background-image: url('https://unpkg.com/leaflet@1.9.4/dist/images/layers.png');
    }

    /* --------- RESPONSIVE LAYOUT --------- */

    @media (max-width: 768px) {
      .app-container {
        /* Stack header, map, sidebar */
        grid-template-columns: 1fr;
        grid-template-rows: 60px auto auto;
        grid-template-areas:
          "header"
          "map"
          "sidebar";
      }

      /* When sidebar is closed on mobile, hide it cleanly
         but keep map full width/height under header */
      .app-container.sidebar-closed {
        grid-template-rows: 60px auto 0;
      }
      .app-container.sidebar-closed .sidebar {
        display: none;
      }

      /* Header: stack and center content so right-side controls stay in view */
      .header-bar {
        padding: 0 8px;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        grid-template-areas:
          "center"
          "right";
        gap: 8px;https://wisefrog.co.uk/
        justify-items: center;
      }

      .header-zone-left {
        display: none;
      }

      .header-zone-center {
        grid-area: center;
        justify-content: center;
        text-align: center;
      }

      .header-zone-right {
        grid-area: right;
        justify-content: center;
      }

      #app-header-title {
        font-size: 18px;
        text-align: center;
        white-space: normal; /* allow wrapping instead of clipping */
      }

      .sidebar {
        border-left: none;
        border-top: 1px solid #d9d9d9;
        max-height: 40vh; /* avoid covering the whole screen */
      }

      .sidebar-content {
        padding: 12px;
      }

      .layer-row {
        font-size: 16px;
        padding: 6px 0;
      }

      .expand-map-button {
        padding: 8px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Start with sidebar closed so mobile sees full map initially -->
  <div class="app-container sidebar-closed">
    <!-- Header Area -->
    <header class="header-bar" id="app-header-bar">
      <div class="header-zone header-zone-left"></div>

      <div class="header-zone header-zone-center">
        <h2 id="app-header-title">canopyMap by Wisefrog; Norwich tree cover</h2>
      </div>

      <div class="header-zone header-zone-right">
        <!-- Pop-out button -->
        <button class="expand-map-button" type="button" onclick="toggleParentExpansion()">
          Pop out map
        </button>
      </div>
    </header>

    <!-- Map Area -->
    <div class="map-window">
      <div id="map"></div>
    </div>

    <!-- Sidebar Area -->
    <aside class="sidebar" id="app-sidebar">
      <div class="sidebar-content">
        <div class="layer-group">
          <h3 class="layer-group-title">Map Layers</h3>
          <div class="layer-group-items">
            <div class="layer-row">
              <input type="checkbox" id="chkCrowns" checked
                     onchange="toggleLayer('crowns-extrusion', this.checked); toggleLayer('crowns-outline', this.checked)">
              <label for="chkCrowns">canopyMap</label>
            </div>

            <div class="layer-row">
              <input type="checkbox" id="chkBuildings" checked
                     onchange="toggleLayer('3d-buildings', this.checked)">
              <label for="chkBuildings">3D Buildings</label>
            </div>

            <div class="layer-row">
              <input type="checkbox" id="chkSatellite"
                     onchange="toggleLayer('satellite-layer', this.checked)">
              <label for="chkSatellite">Satellite</label>
            </div>
          </div>
        </div>

        <div class="layer-group">
          <h3 class="layer-group-title">Terrain Settings</h3>
          <div class="layer-group-items">
            <div class="slider-container">
              <label for="exaggeration">
                Terrain Exaggeration: <span id="exagValue">2.0</span>x
              </label>
              <input id="exaggeration" type="range" min="0" max="10" step="0.1" value="2" />
            </div>
          </div>
        </div>
      </div>

      <div id="wisefrog-footer">
        <span>smart mapping by wisefrog</span>
        <a href="https://wisefrog.co.uk/"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Wise Frog Limited">
          <img src="https://tourmaline-pudding-0fce6c.netlify.app/assets/logos/frog_best.svg"
               alt="WiseFrog logo">
        </a>
      </div>
    </aside>
  </div>

  <script>
    // Pop-out integration with parent (Eleventy portfolio layout)
    function toggleParentExpansion() {
      // Only attempt if this app is inside an iframe with a parent
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'toggleMapExpansion' }, '*');
      }
    }

    mapboxgl.accessToken = 'pk.eyJ1Ijoid2lzZWZyb2dtYXBib3giLCJhIjoiY21zZWp6MHQwMDEwcDJ3c2Zuemt3b3JxaCJ9.cQdNn0RvFCAAGriAH9bGTQ';

    const INITIAL_CENTER = [1.2974, 52.6293]; // Norwich coords
    const INITIAL_ZOOM = 15;
    const isMobile = window.matchMedia('(max-width: 768px)').matches;

    const map = new mapboxgl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          osm: {
            type: 'raster',
            tiles: [
              'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
              'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
              'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
            ],
            tileSize: 256,
            attribution: '&copy; OpenStreetMap contributors'
          }
        },
        layers: [
          {
            id: 'osm-base',
            type: 'raster',
            source: 'osm'
          }
        ]
      },
      center: INITIAL_CENTER,
      zoom: INITIAL_ZOOM,
      pitch: isMobile ? 45 : 60,
      bearing: 0,
      projection: 'globe'
    });

    // Navigation control: move to top-left on mobile to reduce crowding on the right
    map.addControl(
      new mapboxgl.NavigationControl({ visualizePitch: true }),
      isMobile ? 'top-left' : 'top-right'
    );
    map.addControl(new mapboxgl.ScaleControl(), 'bottom-left');

    // Custom control to toggle sidebar visibility (layers panel)
    class LayersToggleControl {
      onAdd(map) {
        this._map = map;
        const container = document.createElement('div');
        container.className = 'mapboxgl-ctrl mapboxgl-ctrl-group layers-toggle-ctrl';

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'layers-toggle-button';
        button.title = 'Map layers';

        button.addEventListener('click', () => {
          const appContainer = document.querySelector('.app-container');
          appContainer.classList.toggle('sidebar-closed');
          // Ensure the map resizes correctly when the grid changes
          map.resize();
        });

        container.appendChild(button);
        return container;
      }

      onRemove() {
        this._map = undefined;
      }
    }

    // Add the layers toggle control to the top-right
    map.addControl(new LayersToggleControl(), 'top-right');

    map.on('load', () => {
      try {
        map.addSource('mapbox-dem', {
          type: 'raster-dem',
          url: 'mapbox://mapbox.mapbox-terrain-dem-v1',
          tileSize: 512,
          maxzoom: 14
        });
        map.setTerrain({ source: 'mapbox-dem', exaggeration: 2.0 });

        map.addLayer({
          id: 'sky',
          type: 'sky',
          paint: {
            'sky-type': 'atmosphere',
            'sky-atmosphere-sun': [0.0, 0.0],
            'sky-atmosphere-sun-intensity': 15
          }
        });

        map.addSource('satellite-source', {
          type: 'raster',
          url: 'mapbox://mapbox.satellite',
          tileSize: 256
        });

        map.addLayer({
          id: 'satellite-layer',
          type: 'raster',
          source: 'satellite-source',
          layout: { visibility: 'none' }
        });

        map.addSource('mapbox-streets', {
          type: 'vector',
          url: 'mapbox://mapbox.mapbox-streets-v8'
        });

        map.addLayer({
          id: '3d-buildings',
          source: 'mapbox-streets',
          'source-layer': 'building',
          filter: ['==', 'extrude', 'true'],
          type: 'fill-extrusion',
          minzoom: 14,
          layout: { visibility: 'visible' },
          paint: {
            'fill-extrusion-color': '#e5e5e5',
            'fill-extrusion-opacity': 0.7,
            'fill-extrusion-height': [
              'interpolate',
              ['linear'],
              ['zoom'],
              14, 0,
              14.05, ['get', 'height']
            ],
            'fill-extrusion-base': [
              'interpolate',
              ['linear'],
              ['zoom'],
              14, 0,
              14.05, ['get', 'min_height']
            ]
          }
        });

        map.addSource('crowns-data', {
          type: 'vector',
          url: 'mapbox://wisefrogmapbox.norwich_ws_crowns_3d_v1'
        });

        map.addLayer({
          id: 'crowns-extrusion',
          type: 'fill-extrusion',
          source: 'crowns-data',
          'source-layer': 'norwich_ws_crowns',
          layout: { visibility: 'visible' },
          paint: {
            'fill-extrusion-color': '#2e8b57',
            'fill-extrusion-opacity': 0.85,
            'fill-extrusion-height': [
              '*',
              [
                'coalesce',
                ['to-number', ['get', 'max_height']],
                5
              ],
              0.5
            ],
            'fill-extrusion-base': 0
          }
        });

        map.addLayer({
          id: 'crowns-outline',
          type: 'line',
          source: 'crowns-data',
          'source-layer': 'norwich_ws_crowns',
          layout: { visibility: 'visible' },
          paint: {
            'line-color': '#0b3d1f',
            'line-width': 1
          }
        });

        map.on('click', 'crowns-extrusion', (e) => {
          const props = e.features?.[0]?.properties || {};
          new mapboxgl.Popup()
            .setLngLat(e.lngLat)
            .setHTML(`<strong>Norwich Watershed Crowns</strong><br>Max Height: ${props.max_height ?? 'N/A'} m`)
            .addTo(map);
        });

        map.on('mouseenter', 'crowns-extrusion', () => {
          map.getCanvas().style.cursor = 'pointer';
        });
        map.on('mouseleave', 'crowns-extrusion', () => {
          map.getCanvas().style.cursor = '';
        });
      } catch (err) {
        console.error("Map load error:", err);
      }
    });

    function toggleLayer(layerId, visible) {
      if (map.getLayer(layerId)) {
        map.setLayoutProperty(layerId, 'visibility', visible ? 'visible' : 'none');
      }
    }

    document.getElementById('exaggeration').addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById('exagValue').innerText = val.toFixed(1);
      map.setTerrain({ source: 'mapbox-dem', exaggeration: val });
    });
  </script>
</body>
</html>

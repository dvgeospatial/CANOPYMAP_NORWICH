  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    .header-bar { background-color: #19606b; display: grid; grid-template-columns: 1fr; align-items: center; gap: 16px; padding: 0 20px; height: 60px; flex-shrink: 0; z-index: 1000; }
    .header-zone { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .header-zone-left { justify-content: flex-start; }
    .header-zone-center { justify-content: center; text-align: center; }
    #app-header-title { color: #fff; font-size: 24px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .map-window { flex: 1; position: relative; background: #e5e5e5; overflow: hidden; }
    #map { width: 100%; height: 100%; }

    .map-attribution {

      right: 14px;
      bottom: 112px;
      z-index: 1002;
      max-width: min(620px, calc(100% - 28px));
      padding: 5px 7px;
      border-radius: 4px;

    .map-attribution a:hover { color: #1e40af; }

    .bottom-temporal-dock { position: absolute; bottom: 0; left: 0; right: 0; z-index: 1001; background: #394050; color: #fff; display: flex; flex-direction: column; box-shadow: 0 -4px 20px rgba(0,0,0,0.35); user-select: none; -webkit-user-select: none; }
    .wheel-viewport { position: relative; height: 44px; overflow: hidden; cursor: grab; border-bottom: 1px solid rgba(255, 255, 255, 0.08); touch-action: pan-y; transition: height 0.2s ease; background: #3c4455; }
    .wheel-viewport.collapsed { height: 0; border-bottom: none; }
    .wheel-viewport.dragging { cursor: grabbing; }
    .wheel-viewport::before, .wheel-viewport::after { position: absolute; top: 0; bottom: 0; z-index: 2; width: 50px; content: ""; pointer-events: none; }
    .wheel-viewport::before { left: 0; background: linear-gradient(90deg, #3c4455, rgba(60,68,85,0)); }
    .wheel-viewport::after { right: 0; background: linear-gradient(270deg, #3c4455, rgba(60,68,85,0)); }
    .wheel-track { position: absolute; top: 0; left: 0; height: 100%; will-change: transform; }
    .wheel-rail-line { position: absolute; top: 0; height: 2px; background: rgba(255, 255, 255, 0.35); pointer-events: none; }
    .daylight-band { position: absolute; top: 0; height: 10px; border-radius: 0 0 2px 2px; background: rgba(197, 216, 45, 0.72); box-shadow: 0 0 0 1px rgba(235, 246, 116, 0.45); pointer-events: none; }
    .month-cell { position: absolute; top: 0; height: 100%; border-left: 1.5px solid rgba(255, 255, 255, 0.7); display: flex; align-items: center; justify-content: center; color: rgba(255, 255, 255, 0.9); font-size: 13px; font-weight: 600; letter-spacing: 0.02em; pointer-events: none; }
    .month-cell.last-month { border-right: 1.5px solid rgba(255, 255, 255, 0.7); }
    .wheel-tick { position: absolute; top: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: translateX(-50%); color: rgba(255, 255, 255, 0.85); font-size: 13px; font-weight: 600; letter-spacing: 0.02em; pointer-events: none; }
    .wheel-tick::before { content: ""; position: absolute; top: 0; width: 1.5px; height: 100%; background: rgba(255, 255, 255, 0.4); }
    .wheel-tick.sub-tick { font-size: 0; }
    .wheel-tick.sub-tick::before { height: 6px; background: rgba(255, 255, 255, 0.25); }
    .fixed-selection-pointer { position: absolute; top: 0; left: 50%; z-index: 4; width: 0; height: 0; border-top: 11px solid #ff6a22; border-right: 8px solid transparent; border-left: 8px solid transparent; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.4)); pointer-events: none; transform: translateX(-50%); }
    .temporal-control-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 48px; padding: 8px 16px; background: #2e3444; }
    .temporal-controls { display: flex; align-items: center; justify-content: center; gap: 10px; min-width: 0; }

    .wisefrog-credit img { height: 24px; width: auto; display: block; filter: brightness(0) invert(1); opacity: 1; transition: opacity 0.15s ease; }
    .wisefrog-credit a:hover span, .wisefrog-credit a:hover img { opacity: 1; }
    .temporal-btn { appearance: none; display: flex; align-items: center; gap: 7px; padding: 6px 14px; border-radius: 5px; border: 1px solid rgba(255, 255, 255, 0.35); background: transparent; color: #fff; cursor: pointer; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; transition: background 0.15s ease, border-color 0.15s ease; white-space: nowrap; }

    .temporal-btn.active { background: #ff6a22; border-color: #ff6a22; color: #fff; }
    .temporal-btn.now-btn { margin-left: 2px; }
    .temporal-icon-svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: inline-block; }
    .sun-compact-status { display: flex; flex-direction: column; justify-content: center; line-height: 1.2; font-size: 11px; color: #d1d5db; font-variant-numeric: tabular-nums; margin-left: 4px; white-space: nowrap; }
    @media (max-width: 768px) {
      .header-bar { padding: 8px; grid-template-columns: 1fr; gap: 8px; justify-items: center; height: auto; }
      .header-zone-left { display: none; }
      #app-header-title { font-size: 18px; text-align: center; white-space: normal; }
      .map-attribution { right: 8px; bottom: 106px; max-width: calc(100% - 16px); font-size: 10px; }
      .temporal-control-bar { grid-template-columns: 1fr; gap: 6px; padding: 6px 8px; }
      .temporal-control-spacer { display: none; }
      .temporal-controls { flex-wrap: wrap; gap: 6px; }
      .wisefrog-credit { justify-self: center; }
      .wisefrog-credit span { font-size: 0.6rem; }
      .wisefrog-credit img { height: 21px; }
      .temporal-btn { padding: 5px 9px; font-size: 12px; }
      .sun-compact-status { font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header-bar">
      <div class="header-zone header-zone-center"><h2 id="app-header-title">Norwich Shade Map</h2></div>
    </header>
    <div class="map-window">

      <div class="map-attribution" aria-label="Map data attribution">

              <span id="dateControlText">01 Aug</span>

            <button id="timeControlButton" class="temporal-btn" type="button" aria-label="Toggle time timeline">

              <span id="timeControlText">13:37</span>

            <div class="sun-compact-status" id="sunCompactStatus">

              <div id="sunAzimuthTxt">195.0° SSW</div>

          </div>

          </div>
        </div>
      </div>
      <input id="sunDateTime" type="datetime-local" hidden>
    </div>
  </div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1Ijoid2lzZWZyb2dtYXBib3giLCJhIjoiY21zZWp6MHQwMDEwcDJ3c2Zuemt3b3JxaCJ9.cQdNn0RvFCAAGriAH9bGTQ';
    const INITIAL_CENTER = [1.2919, 52.6269];
    const INITIAL_ZOOM = 16;
    const INITIAL_BEARING = 0;
    const INITIAL_PITCH = 67;
    const NAVIGATION_RADIUS_METRES = 5000;
    const METRES_PER_DEGREE_LATITUDE = 111320;
    const longitudeDegreesPerMetre = 1 / (METRES_PER_DEGREE_LATITUDE * Math.cos(INITIAL_CENTER[1] * Math.PI / 180));
    const latitudeDelta = NAVIGATION_RADIUS_METRES / METRES_PER_DEGREE_LATITUDE;

    const NORWICH_MAX_BOUNDS = [[INITIAL_CENTER[0] - longitudeDelta, INITIAL_CENTER[1] - latitudeDelta], [INITIAL_CENTER[0] + longitudeDelta, INITIAL_CENTER[1] + latitudeDelta]];
    const isMobile = window.matchMedia('(max-width: 768px)').matches;
    const lighting = { azimuth: 210, polar: 45, shadowIntensity: 1.0, isDaylight: true };
    function normaliseDegrees(value) { return ((value % 360) + 360) % 360; }

      return [
        { id: 'ambient-light', type: 'ambient', properties: { color: lighting.isDaylight ? '#ffffff' : '#9eb9d7', intensity: lighting.isDaylight ? 0.35 : 0.12 } },
        { id: 'sun-light', type: 'directional', properties: { color: '#fff4dc', intensity: lighting.isDaylight ? 0.8 : 0, direction: [lighting.azimuth, lighting.polar], 'cast-shadows': lighting.isDaylight, 'shadow-intensity': lighting.shadowIntensity } }

    }

    });
    map.addControl(new mapboxgl.NavigationControl({ visualizePitch: true }), isMobile ? 'top-left' : 'top-right');
    map.addControl(new mapboxgl.ScaleControl(), 'bottom-left');
    const sunDateTimeInput = document.getElementById('sunDateTime');
    const dateControlButton = document.getElementById('dateControlButton');
    const timeControlButton = document.getElementById('timeControlButton');
    const nowButton = document.getElementById('nowButton');
    const dateControlText = document.getElementById('dateControlText');
    const timeControlText = document.getElementById('timeControlText');
    const sunElevationTxt = document.getElementById('sunElevationTxt');
    const sunAzimuthTxt = document.getElementById('sunAzimuthTxt');

    const wheelTrack = document.getElementById('wheelTrack');

    let currentDate = new Date();
    let wheelDragging = false;

      if (!map.isStyleLoaded()) return;

      const sun = SunCalc.getPosition(currentDate, centre.lat, centre.lng);

      const azimuth = normaliseDegrees(radiansToDegrees(sun.azimuth) + 180);

      lighting.polar = Math.max(0, Math.min(90, 90 - altitude));

      sunElevationTxt.textContent = `${altitude.toFixed(1)}° ∡`;
      sunAzimuthTxt.textContent = `${azimuth.toFixed(1)}° ${degreesToCompass(azimuth)}`;
      dateControlText.textContent = new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'short' }).format(currentDate);
      timeControlText.textContent = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(currentDate);

      wheelTrack.innerHTML = '';
      const centerX = (wheelViewport.clientWidth || window.innerWidth) / 2;
      if (temporalMode === 'date') {
        const year = currentDate.getFullYear();

        for (let m = 0; m < 12; m++) {

          const sunriseOffset = getTimeOfDayOffsetPx(sunTimes.sunrise);
          const sunsetOffset = getTimeOfDayOffsetPx(sunTimes.sunset);
          const daylightBand = document.createElement('div');
          daylightBand.className = 'daylight-band';
          daylightBand.style.left = `${centerX + sunriseOffset - currentOffset}px`;
          daylightBand.style.width = `${Math.max(0, sunsetOffset - sunriseOffset)}px`;

    function setTemporalMode(mode) {

    }

    timeControlButton.addEventListener('click', () => setTemporalMode('time'));

      } else { const maxOffsetPx = 24 * PIXELS_PER_HOUR; const newOffsetPx = Math.max(0, Math.min(maxOffsetPx, dragStartOffsetPx - deltaX)); const totalMinutes = Math.round(((newOffsetPx / maxOffsetPx) * 1439) / 5) * 5; currentDate.setHours(Math.floor(totalMinutes / 60), totalMinutes % 60, 0, 0); }

    map.on('load', () => {

    let moveTimeout;
    map.on('moveend', () => { clearTimeout(moveTimeout); moveTimeout = setTimeout(() => { updateSunCalculations(); if (temporalMode === 'time' && !wheelViewport.classList.contains('collapsed')) renderWheel(); }, 150); });
  </script>
